<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="0.95" cy="0.0" r="1.35">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f1d4d"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06102e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- dezente Bögen im Hintergrund -->
  <circle cx="900" cy="130" r="300" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="40"/>
  <circle cx="900" cy="130" r="440" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="40"/>
  <!-- Sprechblase -->
  <g filter="url(#sh)">
    <path d="M232 268 h500 a96 96 0 0 1 96 96 v250 a96 96 0 0 1 -96 96 h-286 l-128 118 a14 14 0 0 1 -23 -11 v-107 h-63 a96 96 0 0 1 -96 -96 v-250 a96 96 0 0 1 96 -96 z" fill="#ffffff"/>
  </g>
  <text x="482" y="582" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="252" letter-spacing="-6" fill="#1e40af">FR</text>
  <!-- Klassen-Badge -->
  <g filter="url(#sh)">
    <circle cx="790" cy="262" r="128" fill="url(#badge)"/>
  </g>
  <circle cx="790" cy="262" r="128" fill="none" stroke="#fff" stroke-width="14"/>
  <text x="790" y="327" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="180" fill="#fff">6</text>
